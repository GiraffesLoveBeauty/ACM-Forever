<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=forum-directory-7"></head>
<body>
  <main class="login" id="change-password-panel">
    <form id="password-form">
      <h2>设置新密码</h2>
      <p class="muted">首次登录或管理员重置后，请先修改初始密码；也可以在这里自助修改日常密码。</p>
      <label for="old-password">当前密码</label><input id="old-password" type="password" autocomplete="current-password" required>
      <label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <small class="muted">12–128 位，不含空格，并至少包含小写字母、大写字母、数字、符号中的三类。</small>
      <label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" required>
      <button class="btn primary">修改密码</button><div id="password-message" class="muted" role="status"></div>
      <button class="btn" type="button" id="logout">退出登录</button>
    </form>
  </main>
  <script src="/assets/app.js?v=forum-directory-7"></script>
  <script>
    document.getElementById('password-form').addEventListener('submit',async event=>{
      event.preventDefault();const message=document.getElementById('password-message');
      const oldPassword=document.getElementById('old-password').value,newPassword=document.getElementById('new-password').value;
      if(newPassword!==document.getElementById('confirm-password').value){message.textContent='两次输入的新密码不一致。';return}
      try{await api('/auth/change-password',{method:'POST',body:JSON.stringify({old_password:oldPassword,new_password:newPassword})});location.href=['admin','root'].includes(AUTH.role)?'/admin.html':'/home.html'}catch(error){message.textContent=error.message}
    });
  </script>
</body>
</html>
