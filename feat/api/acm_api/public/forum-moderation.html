<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容审核 · ACM Forever</title><link rel="stylesheet" href="/assets/app.css?v=forum-directory-7"><link rel="stylesheet" href="/assets/forum.css?v=forum-directory-7"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Forever</div><nav class="nav"></nav><div class="sidebar-note">ACM Forever · 内容管理</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Community moderation</div><h1>论坛内容审核</h1><span class="muted">复核新话题与用户举报，处理记录留在数据库中。</span></div><div class="userbar"><a class="btn" href="/index.html">返回论坛</a><button class="btn" id="logout">退出</button></div></header><section class="forum-admin-tabs"><button class="btn primary" data-panel="posts">待审核话题</button><button class="btn" data-panel="reports">用户举报</button><button class="btn" id="refresh-moderation">刷新</button></section><section id="moderation-list" class="forum-moderation-list"><div class="empty">正在加载…</div></section></main></div><div class="forum-toast" id="forum-toast" role="status"></div><script src="/assets/app.js?v=forum-directory-7"></script><script>
    let panel='posts';const box=document.getElementById('moderation-list');const toast=message=>{const node=document.getElementById('forum-toast');node.textContent=message;node.classList.add('visible');setTimeout(()=>node.classList.remove('visible'),2500)};
    async function load(){box.innerHTML='<div class="empty">正在加载…</div>';try{const rows=await api(panel==='posts'?'/forum/moderation/posts':'/forum/moderation/reports');if(panel==='posts'){box.innerHTML=rows.map(item=>`<article class="forum-moderation-card"><div class="forum-post-meta"><span class="forum-category-pill">${esc(item.category_name)}</span><span class="forum-post-time">${new Date(item.created_at*1000).toLocaleString()}</span></div><h2>${esc(item.title)}</h2><p class="forum-moderation-byline">投稿人：${esc(item.author_name)}</p><div class="forum-moderation-body">${esc(item.body)}</div><div class="forum-moderation-actions"><button class="btn primary" data-post-decision="publish" data-id="${item.id}">通过并发布</button><button class="btn" data-post-decision="reject" data-id="${item.id}">退回</button></div></article>`).join('')||'<div class="empty">没有待审核话题</div>';document.querySelectorAll('[data-post-decision]').forEach(button=>button.onclick=async()=>{try{await api(`/forum/moderation/posts/${button.dataset.id}`,{method:'POST',body:JSON.stringify({decision:button.dataset.postDecision})});load()}catch(error){toast(error.message)}})}else{box.innerHTML=rows.map(item=>`<article class="forum-moderation-card"><div class="forum-post-meta"><span class="forum-category-pill">举报 #${item.id}</span><span class="forum-post-time">${new Date(item.created_at*1000).toLocaleString()}</span></div><h2><a href="/post.html?id=${item.post_id}" target="_blank" rel="noopener">${esc(item.title)}</a></h2><p>${esc(item.reason)}</p><p class="forum-moderation-byline">举报人：${esc(item.reporter_name)}</p><div class="forum-moderation-actions"><button class="btn primary" data-report-decision="resolve" data-id="${item.id}">确认并处理</button><button class="btn" data-report-decision="dismiss" data-id="${item.id}">驳回举报</button></div></article>`).join('')||'<div class="empty">没有待处理举报</div>';document.querySelectorAll('[data-report-decision]').forEach(button=>button.onclick=async()=>{try{await api(`/forum/moderation/reports/${button.dataset.id}`,{method:'POST',body:JSON.stringify({decision:button.dataset.reportDecision})});load()}catch(error){toast(error.message)}})}}catch(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
    document.querySelectorAll('[data-panel]').forEach(button=>button.onclick=()=>{panel=button.dataset.panel;document.querySelectorAll('[data-panel]').forEach(item=>item.classList.toggle('primary',item===button));load()});document.getElementById('refresh-moderation').onclick=load;window.PAGE_LOAD=load;
  </script></body></html>
