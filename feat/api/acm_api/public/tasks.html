<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同步任务 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=cf4.1"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a class="active" href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Sync monitor</div><h1>同步任务</h1><span class="muted">查看后台同步队列和执行状态</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="topbar"><h2>任务队列</h2><button class="btn" id="refresh">刷新</button></div><div id="tasks" class="list"><div class="empty">正在加载…</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=cf4.1"></script><script>async function load(){try{const d=await api('/tasks');$('#tasks').innerHTML=d.slice().reverse().map(t=>`<div class="list-item"><span><b>#${esc(t.id)} · ${esc(t.kind)}</b><br><small class="muted">QQ ${esc(t.qq_id||'全部')} · ${esc(t.platform||'全部')} · ${esc(t.status)}</small></span><span class="muted">${esc(t.finished_at||t.started_at||'—')}</span></div>`).join('')||'<div class="empty">暂无同步任务</div>'}catch(e){$('#tasks').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('#refresh').onclick=load;window.PAGE_LOAD=load;</script></body></html>
