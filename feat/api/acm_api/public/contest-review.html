<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛事逐题复盘 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=palette-theme-4"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a class="active" href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Contest replay</div><h1>赛事逐题复盘</h1><span class="muted">按比赛编号记录每道题的结果、思路和复盘状态</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="filters"><input id="owner" placeholder="用户 QQ 号"><input id="contest" placeholder="比赛 ID"><button class="btn primary" id="load">加载复盘</button></div><div id="list" class="list"><div class="empty">请输入用户和比赛 ID</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=avatar-webp-1"></script><script>async function loadReviews(){const o=$('#owner').value.trim(),c=$('#contest').value.trim();if(!o||!c)return;try{const d=await api('/contest/reviews?owner_qq_id='+encodeURIComponent(o)+'&contest_id='+encodeURIComponent(c));$('#list').innerHTML=d.length?d.map(x=>'<article class="list-item"><span><b>'+esc(x.problem_id)+'</b><br><small class="muted">'+esc(x.verdict||'未记录')+' · Rating '+esc(x.rating||'未知')+' · '+esc(x.status)+'</small><br><textarea id="note-'+esc(x.problem_id)+'" placeholder="复盘笔记">'+esc(x.note_md||'')+'</textarea></span><button class="btn primary" onclick="saveReview(\''+esc(x.problem_id)+'\')">保存</button></article>').join(''):'<div class="empty">该比赛暂无逐题记录。可通过提交导入后在此编辑。</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function saveReview(problem){await api('/contest/reviews',{method:'PUT',body:JSON.stringify({owner_qq_id:$('#owner').value.trim(),contest_id:$('#contest').value.trim(),problem_id:problem,note_md:$('#note-'+problem).value,status:'reviewed'})});loadReviews()}$('#load').onclick=loadReviews;window.PAGE_LOAD=function(){};</script></body></html>
