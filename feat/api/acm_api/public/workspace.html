<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习工作区 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=design-system-1"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a class="active" href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Learning workspace</div><h1>笔记与计划</h1><span class="muted">将题目、复习和训练目标保存在同一份工作区</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="filters"><input id="owner" placeholder="用户 QQ 号"><input id="title" placeholder="目标或笔记标题"><textarea id="body" placeholder="Markdown 笔记内容"></textarea><button class="btn primary" id="add">新增记录</button><button class="btn" id="reload">刷新</button></div><div id="list" class="list"></div><h2 style="margin-top:24px">持久化计划题单</h2><p class="muted">题目会按平台和题号去重，完成状态保存在数据库中。</p><div id="plan" class="list"><div class="empty">请输入 QQ 号后加载</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=design-system-1"></script><script>async function load(){const owner=$('#owner').value.trim();if(!owner){$('#list').innerHTML='<div class="empty">请输入 QQ 号后加载笔记</div>';return}try{const d=await api('/workspace/items?owner_qq_id='+encodeURIComponent(owner));$('#list').innerHTML=d.map(x=>`<div class="list-item"><span><b>${esc(x.title)}</b><br><small>${esc(x.body_md||'')}</small><br><small class="muted">${esc(x.status)} · ${esc(x.context_type||'general')}</small></span><button class="btn" onclick="removeItem(${x.id})">删除</button></div>`).join('')||'<div class="empty">暂无目标或笔记</div>';await loadPlan()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function addItem(){const owner=$('#owner').value.trim();if(!owner||!$('#title').value.trim())return alert('QQ 号和标题必填');await api('/workspace/items',{method:'POST',body:JSON.stringify({owner_qq_id:owner,title:$('#title').value,body_md:$('#body').value,kind:'note'})});$('#title').value='';$('#body').value='';load()}async function removeItem(id){await api('/workspace/items/'+id,{method:'DELETE'});load()}async function loadPlan(){const owner=$('#owner').value.trim();if(!owner)return;try{const d=await api('/study-plan?owner_qq_id='+encodeURIComponent(owner));$('#plan').innerHTML=d.map(x=>`<div class="list-item"><span><b>${esc(x.problem_name||x.problem_id)}</b><br><small class="muted">${esc(x.platform)} · Rating ${esc(x.problem_rating||'未知')} · ${esc(x.status)}</small></span><span class="chips">${x.problem_url?`<a class="btn" href="${esc(x.problem_url)}" target="_blank">打开</a>`:''}<button class="btn" onclick="planAction('${esc(x.platform)}','${esc(x.problem_id)}','${x.status==='done'?'pending':'done'}')">${x.status==='done'?'恢复':'完成'}</button><button class="btn" onclick="deletePlan('${esc(x.platform)}','${esc(x.problem_id)}')">删除</button></span></div>`).join('')||'<div class="empty">暂无计划题目</div>'}catch(e){$('#plan').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function planAction(platform,problem_id,status){await api('/study-plan',{method:'PATCH',body:JSON.stringify({owner_qq_id:$('#owner').value.trim(),platform,problem_id,status})});loadPlan()}async function deletePlan(platform,problem_id){await api('/study-plan',{method:'DELETE',body:JSON.stringify({owner_qq_id:$('#owner').value.trim(),platform,problem_id})});loadPlan()}$('#add').onclick=addItem;$('#reload').onclick=load;window.PAGE_LOAD=function(){};</script></body></html>
