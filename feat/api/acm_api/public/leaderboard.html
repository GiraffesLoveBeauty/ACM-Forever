<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排行榜 · ACM Forever</title><link rel="stylesheet" href="/assets/app.css?v=forum-directory-7"><link rel="stylesheet" href="/assets/forum.css?v=solid-backdrop-2"></head>
<body class="forum-page leaderboard-page">
  <header class="forum-header"><a class="forum-brand" href="/index.html"><img class="icpc-brand-logo" src="/assets/icpc-logo.png" alt="ICPC 官方标志"><span>ACM <b>Forever</b><small>计量 ACMer 学习社区</small></span></a><nav class="nav primary-nav" aria-label="主导航"></nav><div class="forum-header-actions"><button class="btn" id="theme-toggle" aria-label="切换主题">◐</button><a class="btn" id="login-link" href="/login.html">登录</a><button class="btn" id="logout" style="display:none">退出</button></div></header>
  <main class="community-main leaderboard-main">
    <section class="community-page-heading leaderboard-heading"><div><h1>社区排行榜</h1><p id="subtitle">近 7 日各平台去重 AC 题数，仅展示公开昵称与统计。</p></div><figure class="community-heading-photo"><img src="/assets/community-study-group.jpg" alt="同学们一起交流解题思路" loading="lazy"></figure></section>
    <section class="community-panel leaderboard-panel">
      <div class="leaderboard-toolbar">
        <form id="rank-search" class="rank-search"><span>⌕</span><input id="search" type="search" placeholder="按公开昵称或身份搜索"><button type="submit">查找</button></form>
        <div class="rank-selects"><label>统计区间<select id="days"><option value="7">近 7 日</option><option value="30">近 30 日</option><option value="90">近 90 日</option><option value="365">近 1 年</option><option value="all">生涯</option></select></label><label>排序方式<select id="sort"><option value="total_count">总 AC 数</option><option value="cf_count">Codeforces</option><option value="luogu_count">洛谷</option><option value="nowcoder_count">牛客</option><option value="atcoder_count">AtCoder</option><option value="cjlu_count">校 OJ</option></select></label><label>每页显示<select id="page-size"><option value="10">10 人</option><option value="20" selected>20 人</option><option value="50">50 人</option><option value="100">100 人</option></select></label></div>
        <div class="rank-platforms"><div class="rank-platforms-label">计入总 AC 的平台</div><div class="oj-filters" id="platform-filters">
          <label class="oj-filter"><input type="checkbox" value="codeforces" checked><span class="oj-icon oj-cf">CF</span><span>Codeforces</span></label><label class="oj-filter"><input type="checkbox" value="luogu" checked><span class="oj-icon oj-luogu">洛</span><span>洛谷</span></label><label class="oj-filter"><input type="checkbox" value="nowcoder" checked><span class="oj-icon oj-nowcoder">牛客</span><span>牛客</span></label><label class="oj-filter"><input type="checkbox" value="atcoder" checked><span class="oj-icon oj-atcoder">At</span><span>AtCoder</span></label><label class="oj-filter"><input type="checkbox" value="cjlu" checked><span class="oj-icon oj-cjlu">校</span><span>校 OJ</span></label>
        </div></div>
      </div>
      <div class="leaderboard-summary"><b id="summary">正在加载排行榜…</b><span class="muted">按平台去重统计</span></div>
      <div class="community-table-wrap"><table class="community-table"><thead><tr><th>排名</th><th>成员</th><th>Codeforces</th><th>洛谷</th><th>牛客</th><th>AtCoder</th><th>校 OJ</th><th>总题数</th><th>身份</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">正在加载排行榜…</td></tr></tbody></table></div>
      <div class="leaderboard-pagination"><button class="btn" id="prev">← 上一页</button><span class="muted" id="pager">—</span><button class="btn" id="next">下一页 →</button></div>
    </section>
    <p class="leaderboard-footnote">排行榜根据已同步的 OJ 通过记录统计；题数按平台与题号去重。</p>
  </main>
  <script src="/assets/app.js?v=forum-directory-7"></script>
  <script>
    const state={rows:[],total:0,page:1,pageSize:20};
    const dayLabels={7:'近 7 日',30:'近 30 日',90:'近 90 日',365:'近 1 年',all:'生涯'};
    function queryString(){const platforms=[...document.querySelectorAll('#platform-filters input:checked')].map(input=>input.value).join(',');return new URLSearchParams({days:$('#days').value,sort:$('#sort').value,search:$('#search').value.trim(),page_size:$('#page-size').value,platforms,page:String(state.page)}).toString()}
    async function load(resetPage=false){if(resetPage)state.page=1;const box=$('#rows');box.innerHTML='<tr><td colspan="9" class="empty">正在加载排行榜…</td></tr>';try{const data=await api('/community/leaderboard?'+queryString());state.rows=Array.isArray(data.rows)?data.rows:[];state.total=Number(data.total||0);state.page=Number(data.page||1);state.pageSize=Number(data.page_size||$('#page-size').value);render()}catch(error){box.innerHTML=`<tr><td colspan="9" class="empty">排行榜加载失败：${esc(error.message)}</td></tr>`;$('#summary').textContent='加载失败'}}
    function render(){const pages=Math.max(1,Math.ceil(state.total/state.pageSize));$('#subtitle').textContent=`${dayLabels[$('#days').value]||'指定范围'}各平台去重 AC 题数 · 公开昵称与统计`;$('#summary').textContent=`共 ${state.total} 名成员`;$('#pager').textContent=`第 ${state.page} / ${pages} 页`;$('#prev').disabled=state.page<=1;$('#next').disabled=state.page>=pages;$('#rows').innerHTML=state.rows.map((user,index)=>`<tr><td><span class="rank-number ${state.page===1&&index<3?'rank-top-'+(index+1):''}">${(state.page-1)*state.pageSize+index+1}</span></td><td><b class="rank-member-name">${esc(user.name||'ACM 成员')}</b></td><td>${user.cf_count||0}</td><td>${user.luogu_count||0}</td><td>${user.nowcoder_count||0}</td><td>${user.atcoder_count||0}</td><td>${user.cjlu_count||0}</td><td><b class="rank-total">${user.total_count||0}</b></td><td><span class="rank-status">${esc(user.status||'—')}</span></td></tr>`).join('')||'<tr><td colspan="9" class="empty">暂无符合条件的成员</td></tr>';window.animateNumbers?.($('#rows'))}
    document.getElementById('rank-search').onsubmit=event=>{event.preventDefault();load(true)};$('#days').onchange=()=>load(true);$('#sort').onchange=()=>load(true);$('#page-size').onchange=()=>load(true);document.querySelectorAll('#platform-filters input').forEach(input=>input.onchange=event=>{if(!document.querySelector('#platform-filters input:checked')){event.target.checked=true;return}load(true)});$('#prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('#next').onclick=()=>{state.page++;load()};
    window.PAGE_LOAD=async()=>{const login=$('#login-link');if(AUTH.authenticated){login.textContent=AUTH.role==='member'?'个人中心':'管理中心';login.href=AUTH.role==='member'?'/home.html':'/admin.html';$('#logout').style.display=''}await load()};
  </script>
</body>
</html>
