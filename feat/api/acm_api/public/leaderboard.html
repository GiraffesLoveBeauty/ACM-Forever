<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>排行榜 · ACM Compass</title>
  <link rel="stylesheet" href="/assets/app.css?v=cf4.2">
  <style>
    .oj-filters { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; width:100%; }
    .oj-filter { position:relative; display:flex; align-items:center; gap:9px; min-height:46px; padding:8px 12px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(145deg,var(--panel),var(--bg)); color:var(--text); cursor:pointer; font-weight:700; transition:border-color .18s,box-shadow .18s,transform .18s; }
    .oj-filter:hover { border-color:var(--brand2); transform:translateY(-1px); }
    .oj-filter:has(input:checked) { border-color:var(--brand); box-shadow:0 5px 16px rgba(117,103,237,.16); }
    .oj-filter input { position:absolute; width:1px; height:1px; min-width:0; opacity:0; pointer-events:none; }
    .oj-filter:has(input:checked)::after { content:'✓'; margin-left:auto; color:var(--brand); font-size:15px; }
    .oj-icon { display:grid; place-items:center; width:27px; height:27px; flex:none; border-radius:8px; color:#fff; font-size:10px; letter-spacing:-.04em; box-shadow:inset 0 1px rgba(255,255,255,.35); }
    .oj-cf { background:#1f6feb; }
    .oj-luogu { background:#20a36a; }
    .oj-nowcoder { background:#f08a24; }
    .oj-atcoder { background:#5b62c8; }
    .oj-cjlu { background:#159b91; }
    @media (max-width:900px) { .oj-filters { grid-template-columns:repeat(3,minmax(130px,1fr)); } }
    @media (max-width:600px) { .oj-filters { grid-template-columns:repeat(2,minmax(120px,1fr)); } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>✦</b> ACM Compass</div>
      <nav class="nav">
        <a href="/index.html">⌂ 总览</a>
        <a class="active" href="/leaderboard.html">♛ 排行榜</a>
        <a href="/challenge.html">◎ 今日训练</a>
        <a href="/reviews.html">✓ 待复盘</a>
        <a href="/tasks.html">↻ 同步任务</a>
        <a href="/problem-bank.html">▦ 题库工作台</a>
        <a href="/submissions.html">◷ 提交时间线</a>
        <a href="/workspace.html">✎ 笔记与目标</a>
        <a href="/contest-review.html">◈ 赛事复盘</a>
        <a href="/settings.html">⚙ 设置</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Community standings</div>
          <h1>排行榜</h1>
          <span class="muted" id="subtitle">近 7 日各平台去重 AC 题数 · 公开昵称与统计</span>
        </div>
        <div class="userbar">
          <button class="btn" id="theme-toggle">◐</button>
          <a class="btn" id="login-link" href="/login.html">登录</a>
          <button class="btn" id="logout" style="display:none">退出</button>
        </div>
      </header>
      <section class="card">
        <div class="filters">
          <input id="search" placeholder="按公开昵称或身份搜索">
          <div class="oj-filters" id="platform-filters" title="勾选计入排行榜总题数的平台">
            <label class="oj-filter"><input type="checkbox" value="codeforces" checked><span class="oj-icon oj-cf">CF</span><span>Codeforces</span></label>
            <label class="oj-filter"><input type="checkbox" value="luogu" checked><span class="oj-icon oj-luogu">洛</span><span>洛谷</span></label>
            <label class="oj-filter"><input type="checkbox" value="nowcoder" checked><span class="oj-icon oj-nowcoder">牛客</span><span>牛客</span></label>
            <label class="oj-filter"><input type="checkbox" value="atcoder" checked><span class="oj-icon oj-atcoder">At</span><span>AtCoder</span></label>
            <label class="oj-filter"><input type="checkbox" value="cjlu" checked><span class="oj-icon oj-cjlu">校</span><span>校 OJ</span></label>
          </div>
          <select id="days">
            <option value="7">近 7 日</option>
            <option value="30">近 30 日</option>
            <option value="90">近 90 日</option>
            <option value="365">近 1 年</option>
            <option value="all">生涯</option>
          </select>
          <select id="sort">
            <option value="total_count">按总题数</option>
            <option value="cf_count">按 Codeforces</option>
            <option value="luogu_count">按洛谷</option>
            <option value="nowcoder_count">按牛客</option>
            <option value="atcoder_count">按 AtCoder</option>
            <option value="cjlu_count">按校 OJ</option>
          </select>
          <select id="page-size">
            <option value="10">每页 10 条</option>
            <option value="20" selected>每页 20 条</option>
            <option value="50">每页 50 条</option>
            <option value="100">每页 100 条</option>
          </select>
          <button class="btn primary" id="refresh">查询</button>
        </div>
        <div class="topbar" style="margin-top:14px">
          <span class="muted" id="summary">正在加载排行榜…</span>
          <span class="muted">只展示公开昵称与刷题统计</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>成员</th>
                <th>CF</th>
                <th>洛谷</th>
                <th>牛客</th>
                <th>AtCoder</th>
                <th>校 OJ</th>
                <th>总题数</th>
                <th>身份</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr><td colspan="9" class="empty">正在加载排行榜…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="topbar" style="margin-top:16px">
          <button class="btn" id="prev">上一页</button>
          <span class="muted" id="pager">—</span>
          <button class="btn" id="next">下一页</button>
        </div>
      </section>
    </main>
  </div>
  <div id="login" class="login" style="display:none">
    <form id="login-form">
      <h2>登录</h2>
      <input id="username" required>
      <input id="password" type="password" required>
      <button class="btn primary">登录</button>
    </form>
  </div>
  <script src="/assets/app.js?v=cf4.2"></script>
  <script>
    const state = { rows: [], total: 0, page: 1, pageSize: 20 };
    const dayLabels = {7: '近 7 日', 30: '近 30 日', 90: '近 90 日', 365: '近 1 年', all: '生涯'};

    function queryString(includePage = true) {
      const platforms = [...document.querySelectorAll('#platform-filters input:checked')].map(input => input.value).join(',');
      const params = new URLSearchParams({
        days: $('#days').value,
        sort: $('#sort').value,
        search: $('#search').value.trim(),
        page_size: $('#page-size').value,
        platforms,
      });
      if (includePage) params.set('page', String(state.page));
      return params.toString();
    }

    async function load(resetPage = false) {
      if (resetPage) state.page = 1;
      const box = $('#rows');
      box.innerHTML = '<tr><td colspan="9" class="empty">正在加载排行榜…</td></tr>';
      try {
        const data = await api('/community/leaderboard?' + queryString());
        state.rows = Array.isArray(data.rows) ? data.rows : [];
        state.total = Number(data.total || 0);
        state.page = Number(data.page || 1);
        state.pageSize = Number(data.page_size || $('#page-size').value);
        render();
      } catch (error) {
        box.innerHTML = `<tr><td colspan="9" class="empty">排行榜加载失败：${esc(error.message)}</td></tr>`;
        $('#summary').textContent = '加载失败';
      }
    }

    function render() {
      const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
      $('#subtitle').textContent = `${dayLabels[$('#days').value] || '指定范围'}各平台去重 AC 题数`;
      $('#summary').textContent = `共 ${state.total} 名成员 · 当前显示第 ${state.page} / ${pages} 页`;
      $('#pager').textContent = `第 ${state.page} / ${pages} 页`;
      $('#prev').disabled = state.page <= 1;
      $('#next').disabled = state.page >= pages;
      $('#rows').innerHTML = state.rows.map((user, index) => {
        const rank = (state.page - 1) * state.pageSize + index + 1;
        const nickname = esc(user.name || '未命名');
        return `<tr>
          <td><b>${rank}</b></td>
          <td><b>${nickname}</b></td>
          <td>${user.cf_count || 0}</td>
          <td>${user.luogu_count || 0}</td>
          <td>${user.nowcoder_count || 0}</td>
          <td>${user.atcoder_count || 0}</td>
          <td>${user.cjlu_count || 0}</td>
          <td><b>${user.total_count || 0}</b></td>
          <td>${esc(user.status || '—')}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
    }

    $('#refresh').onclick = () => load(true);
    $('#days').onchange = () => load(true);
    $('#sort').onchange = () => load(true);
    $('#page-size').onchange = () => load(true);
    document.querySelectorAll('#platform-filters input').forEach(input => input.onchange = event => {
      const checked = document.querySelectorAll('#platform-filters input:checked');
      if (!checked.length) {
        event.target.checked = true;
        return;
      }
      load(true);
    });
    $('#search').onkeydown = event => { if (event.key === 'Enter') load(true); };
    $('#prev').onclick = () => { if (state.page > 1) { state.page -= 1; load(); } };
    $('#next').onclick = () => { state.page += 1; load(); };
    window.PAGE_LOAD = async () => {
      const login = $('#login-link');
      if (AUTH.authenticated) {
        login.textContent = AUTH.role === 'member' ? '个人中心' : '管理中心';
        login.href = AUTH.role === 'member' ? '/home.html' : '/admin.html';
        $('#logout').style.display = '';
      }
      await load();
    };
  </script>
</body>
</html>
