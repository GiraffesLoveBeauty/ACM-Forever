<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>成员详情 · ACM Compass</title>
  <link rel="stylesheet" href="/assets/app.css?v=palette-theme-4">
  <style>
    .profile-columns { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .profile-column { min-width:0; }
    .profile-column h3 { margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--line); font-size:15px; }
    .profile-row { display:grid; grid-template-columns:92px minmax(0,1fr); align-items:center; gap:14px; margin:0 0 12px; }
    .profile-row > span { color:var(--muted); font-size:13px; font-weight:700; }
    .profile-row > input { width:100%; min-width:0; }
    .profile-row > input[readonly] { opacity:.72; cursor:not-allowed; }
    .recent-ac-item { align-items:flex-start; }
    .recent-ac-main { min-width:0; text-align:left; }
    .recent-ac-meta { display:block; margin-top:3px; text-align:left; }
    .problem-tags { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:5px; margin-top:7px; }
    .problem-tag { padding:2px 8px; border:1px solid #d9d5ff; border-radius:999px; background:#f4f2ff; color:var(--brand); font-size:11px; line-height:1.5; }
    [data-theme=dark] .problem-tag { border-color:#4a4775; background:#2c2a4b; }
    @media (max-width:800px) { .profile-columns { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>✦</b> ACM Compass</div>
      <nav class="nav">
        <a href="/index.html">⌂ 总览</a>
        <a href="/leaderboard.html">♛ 排行榜</a>
        <a href="/challenge.html">◎ 今日训练</a>
        <a href="/reviews.html">✓ 待复盘</a>
        <a href="/tasks.html">↻ 同步任务</a>
        <a href="/problem-bank.html">▦ 题库工作台</a>
        <a href="/submissions.html">◷ 提交时间线</a>
        <a href="/workspace.html">✎ 笔记与目标</a>
        <a href="/contest-review.html">◈ 赛事复盘</a>
        <a href="/settings.html">⚙ 设置</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Member profile</div>
          <h1>成员详情</h1>
          <span class="muted">个人信息、权限和刷题数据</span>
        </div>
        <div class="userbar">
          <button class="btn" id="theme-toggle">◐</button>
          <button class="btn" id="logout">退出</button>
        </div>
      </header>
      <div id="content" class="empty">正在加载…</div>
    </main>
  </div>
  <div id="login" class="login" style="display:none">
    <form id="login-form">
      <h2>登录</h2>
      <input id="username" required>
      <input id="password" type="password" required>
      <button class="btn primary">登录</button>
    </form>
  </div>
  <script src="/assets/app.js?v=forum-header-avatar-6"></script>
  <script>
    let memberData = null;
    const memberId = new URLSearchParams(location.search).get('qq_id');

    function profileField(id, label, value, placeholder = '') {
      return `<label class="profile-row"><span>${label}</span><input id="${id}" value="${esc(value || '')}" placeholder="${placeholder}"></label>`;
    }

    function renderProfile(user, permissions) {
      const role = permissions?.role || 'member';
      const roleLabel = {root: 'root', admin: 'QQBot 管理员', member: '普通成员'}[role] || '普通成员';
      const canManage = !!permissions?.can_manage;
      let permissionAction = '<span class="muted">只有 root 可以修改 QQBot 管理员权限。</span>';
      if (role === 'root') {
        permissionAction = '<span class="muted">全局 root 权限不可在此降级。</span>';
      } else if (canManage) {
        const nextRole = role === 'admin' ? 'member' : 'admin';
        const text = role === 'admin' ? '降级为普通成员' : '提升为 QQBot 管理员';
        permissionAction = `<button class="btn ${role === 'admin' ? '' : 'primary'}" onclick="changePermission('${nextRole}')">${text}</button>`;
      }
      $('#content').innerHTML = `
        <section class="card">
          <div class="topbar">
            <div><h2>个人信息</h2><span class="muted">管理员可以修改昵称、真实姓名、学校、身份和绑定的平台账号。</span></div>
            <span id="profile-msg" class="muted"></span>
          </div>
          <div class="grid two profile-columns">
            <div class="profile-column">
              <h3>个人信息</h3>
              <label class="profile-row"><span>QQ 号</span><input value="${esc(user.qq_id || memberId)}" readonly></label>
              ${profileField('profile-name', '成员昵称', user.name, '未命名')}
              ${profileField('profile-real-name', '真实姓名', user.real_name, '留空时排行榜显示 —')}
              ${profileField('profile-school', '学校', user.school, '学校名称')}
              ${profileField('profile-status', '身份', user.status, '例如：大一 / 教练 / 校友')}
            </div>
            <div class="profile-column">
              <h3>OJ 账号</h3>
              ${profileField('profile-cf', 'Codeforces 账号', user.cf_handle, 'Handle')}
              ${profileField('profile-luogu', '洛谷账号', user.luogu_id, '用户 ID')}
              ${profileField('profile-nowcoder', '牛客账号', user.nowcoder_id, '用户名')}
              ${profileField('profile-atcoder', 'AtCoder 账号', user.atcoder_handle, 'Handle')}
              ${profileField('profile-cjlu', '校 OJ 账号', user.cjlu_username, '用户名')}
            </div>
          </div>
          <div class="topbar" style="margin-top:18px;margin-bottom:0">
            <span class="muted">管理员可直接绑定、换绑或清空 OJ 账号。账号变更后会清理旧记录，并在后台重新拉取该平台全部历史。</span>
            <button class="btn primary" onclick="saveProfile()">保存个人信息</button>
          </div>
        </section>
        <section class="card" style="margin-top:18px">
          <div class="topbar" style="margin-bottom:0">
            <div><h2>权限管理</h2><span class="muted">当前权限：<b>${roleLabel}</b></span></div>
            ${permissionAction}
          </div>
        </section>
        <section class="grid kpis" style="margin-top:18px">
          <div class="card"><div class="label">成员</div><div class="value" style="font-size:22px">${esc(user.name || memberId)}</div></div>
          <div class="card"><div class="label">CF Rating</div><div class="value">${esc(memberData.cf?.rating ?? '—')}</div></div>
          <div class="card"><div class="label">AtCoder Rating</div><div class="value">${esc(memberData.atcoder?.rating ?? '—')}</div></div>
          <div class="card"><div class="label">挑战 Rating</div><div class="value">${esc(memberData.challenge_rating ?? '—')}</div></div>
        </section>
        <section class="card" style="margin-top:18px">
          <h2>平台统计</h2>
          <div class="chips">${Object.entries(memberData.platform_counts || {}).map(([key, count]) => `<span class="chip">${esc(key)}：${count} 题</span>`).join('') || '<span class="muted">暂无统计</span>'}</div>
        </section>
        <section class="card" style="margin-top:18px">
          <h2>最近 AC</h2>
          <div class="list">${(memberData.recent_ac || []).slice(0, 20).map(item => { const tags = item.platform === 'codeforces' && Array.isArray(item.tags) ? item.tags : []; return `<div class="list-item recent-ac-item"><span class="recent-ac-main"><b>${esc(item.problem_name || item.problem_id)}</b><small class="muted recent-ac-meta">${esc(item.platform)} · 难度 ${esc(item.problem_rating || '未知')}</small>${tags.length ? `<span class="problem-tags">${tags.map(tag => `<span class="problem-tag">${esc(tag)}</span>`).join('')}</span>` : ''}</span>${item.problem_url ? `<a class="btn" href="${esc(item.problem_url)}" target="_blank" rel="noopener noreferrer">打开</a>` : ''}</div>`; }).join('') || '<div class="empty">暂无记录</div>'}</div>
        </section>`;
    }

    async function load() {
      if (!memberId) {
        $('#content').textContent = '缺少 qq_id 参数';
        return;
      }
      try {
        memberData = await api('/member/' + encodeURIComponent(memberId));
        renderProfile(memberData.user, memberData.permissions);
      } catch (error) {
        $('#content').textContent = error.message;
      }
    }

    async function saveProfile() {
      const data = {
        qq_id: memberId,
        name: $('#profile-name').value,
        real_name: $('#profile-real-name').value,
        school: $('#profile-school').value,
        status: $('#profile-status').value,
        cf_handle: $('#profile-cf').value,
        luogu_id: $('#profile-luogu').value,
        nowcoder_id: $('#profile-nowcoder').value,
        atcoder_handle: $('#profile-atcoder').value,
        cjlu_username: $('#profile-cjlu').value,
      };
      try {
        const result = await api('/user', {method: 'PUT', body: JSON.stringify(data)});
        await load();
        showMessage(result.message || '个人信息已保存');
      } catch (error) {
        showMessage(error.message);
      }
    }

    async function changePermission(role) {
      const action = role === 'admin' ? '提升为 QQBot 管理员' : '降级为普通成员';
      if (!confirm(`确定将该成员${action}吗？`)) return;
      try {
        await api('/member/' + encodeURIComponent(memberId) + '/permissions', {method: 'PUT', body: JSON.stringify({role})});
        await load();
        showMessage('权限已更新');
      } catch (error) {
        showMessage(error.message);
      }
    }

    function showMessage(message) {
      const box = $('#profile-msg');
      if (box) {
        box.textContent = message;
        setTimeout(() => { box.textContent = ''; }, 3000);
      }
    }

    window.PAGE_LOAD = load;
  </script>
</body>
</html>
