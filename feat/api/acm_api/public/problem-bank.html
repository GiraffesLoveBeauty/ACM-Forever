<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库工作台 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=cf4.0"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a class="active" href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav><div class="sidebar-note">Problem library<br>Find the next problem.</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Problem library</div><h1>题库工作台</h1><span class="muted">从真实同步题目中筛选、收藏并记录复盘状态</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="filters"><input id="owner" placeholder="QQ 号（保存收藏/笔记时填写）"><select id="platform"><option value="">全部平台</option><option value="codeforces">Codeforces</option><option value="luogu">洛谷</option><option value="atcoder">AtCoder</option><option value="nowcoder">牛客</option></select><input id="query" placeholder="搜索题号、题名或标签"><select id="state"><option value="">全部状态</option><option value="inbox">未整理</option><option value="favorite">已收藏</option></select><button class="btn primary" id="search-btn">筛选题目</button></div><div class="topbar"><span class="muted" id="count">准备加载题库</span><span class="muted">数据来自本地同步库，不虚构题目</span></div><div id="list" class="list"><div class="empty">正在加载题库…</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=cf4.0"></script><script>let problems=[],problemTotal=0;async function load(){await loadProblems()}async function loadProblems(){const list=document.getElementById('list');list.innerHTML='<div class="empty">正在查询真实题库…</div>';try{const p=document.getElementById('platform').value,q=document.getElementById('query').value.trim(),owner=document.getElementById('owner').value.trim(),state=document.getElementById('state').value;let url='/problems?owner_qq_id='+encodeURIComponent(owner);if(p)url+='&platform='+encodeURIComponent(p);if(q)url+='&tag='+encodeURIComponent(q);if(state)url+='&state='+encodeURIComponent(state);problems=await api(url);problemTotal=Array.isArray(problems)?problems.length:Number(problems.total||0);problems=Array.isArray(problems)?problems:(problems.items||[]);render()}catch(e){list.innerHTML='<div class="empty">题库加载失败：'+esc(e.message)+'</div>'}}function render(){const state=document.getElementById('state').value;const d=problems.filter(p=>!state||state==='favorite'&&p.is_favorite||state==='inbox'&&(p.user_state||'inbox')==='inbox');document.getElementById('count').textContent=(problemTotal>d.length?`${d.length} 道题目（共 ${problemTotal} 道，当前最多显示 500 道）`:`${d.length} 道题目`);document.getElementById('list').innerHTML=d.map(p=>`<article class="list-item"><span><b>${esc(p.platform)} · ${esc(p.problem_id)}</b><br><strong>${esc(p.problem_name||'未命名题目')}</strong><br><small class="muted">Rating ${esc(p.problem_rating||'未知')} · ${esc(p.user_state||'inbox')}${p.note_md?' · 已有笔记':''}</small></span><span class="chips"><button class="btn" onclick="toggleFavorite('${esc(p.platform)}','${esc(p.problem_id)}',${p.is_favorite?0:1})">${p.is_favorite?'取消收藏':'收藏'}</button><a class="btn" href="${esc(p.problem_url)}" target="_blank" rel="noopener noreferrer">打开题目</a></span></article>`).join('')||'<div class="empty">没有匹配题目，请调整筛选条件或先同步平台数据。</div>'}async function toggleFavorite(platform,id,value){const owner=document.getElementById('owner').value.trim();if(!owner){alert('请先填写 QQ 号，才能保存题目状态');return}try{await api('/problems/'+encodeURIComponent(platform)+'/'+encodeURIComponent(id)+'/state',{method:'PUT',body:JSON.stringify({owner_qq_id:owner,is_favorite:!!value,state:value?'favorite':'inbox'})});await loadProblems()}catch(e){alert(e.message)}}document.getElementById('search-btn').onclick=loadProblems;document.getElementById('state').onchange=render;window.PAGE_LOAD=load;</script></body></html>
