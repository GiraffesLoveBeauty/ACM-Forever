<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 · ACM Forever</title><link rel="stylesheet" href="/assets/app.css?v=forum-directory-7"><link rel="stylesheet" href="/assets/forum.css?v=avatar-upload-1"></head>
<body class="forum-page personal-page">
  <header class="forum-header"><a class="forum-brand" href="/index.html"><img class="icpc-brand-logo" src="/assets/icpc-logo.png" alt="ICPC 官方标志"><span>ACM <b>Forever</b><small>计量 ACMer 学习社区</small></span></a><nav class="nav primary-nav" aria-label="主导航"></nav><div class="forum-header-actions"><button class="btn" id="theme-toggle" aria-label="切换主题">◐</button><button class="btn" id="logout">退出</button></div></header>
  <main class="community-main personal-main">
    <section class="personal-welcome"><div><h1 id="greeting">个人中心</h1><p>查看刷题进度、账号绑定和社区参与。</p></div><figure class="community-heading-photo"><img src="/assets/community-coding.jpg" alt="一起专注做题的学习时刻" loading="lazy"></figure><a class="personal-rank-link" href="/leaderboard.html"><span>社区排行榜</span><b>查看大家的进度　↗</b></a></section>
    <section class="profile-stat-grid grid kpis" id="stats"></section>
    <div class="personal-columns">
      <section class="community-panel profile-details-panel"><div class="panel-heading"><h2>个人资料</h2><button class="btn" id="edit-name">修改昵称</button></div><p class="panel-caption">绑定账号和做题统计仅本人及管理员可见。</p><div class="profile-avatar-editor"><img id="profile-avatar-preview" class="user-avatar profile-avatar-preview" src="/assets/default-avatar.png" alt="当前头像"><div class="profile-avatar-copy"><b>社区头像</b><small id="avatar-size-note">支持常见图片格式，上传时自动压缩</small><div class="profile-avatar-actions"><label class="btn" for="avatar-file">选择图片</label><input id="avatar-file" type="file" accept="image/*" hidden><button class="btn primary" id="upload-avatar" type="button">上传头像</button><button class="btn" id="reset-avatar" type="button">恢复默认</button></div></div></div><div id="profile" class="profile-binding-grid"></div></section>
      <section class="community-panel recent-panel"><div class="panel-heading"><h2>最近 AC</h2><a class="panel-text-link" href="/submissions.html">提交时间线　↗</a></div><div id="recent" class="list"><div class="empty">正在加载…</div></div></section>
    </div>
    <section class="community-panel personal-community-panel"><div class="panel-heading"><h2>我的社区内容</h2><a class="panel-text-link" href="/compose.html">查看草稿 / 写新话题　↗</a></div><div class="personal-content-tabs"><button class="personal-content-tab active" data-forum-tab="posts">我的话题</button><button class="personal-content-tab" data-forum-tab="bookmarks">我的收藏</button></div><div id="my-forum-content" class="personal-content-list"><div class="empty">正在加载…</div></div></section>
  </main>
  <script src="/assets/app.js?v=avatar-upload-1"></script>
  <script>
    let profileData;
    const avatarTargetBytes=1750*1024;
    const formatBytes=bytes=>bytes<1024*1024?`${Math.max(1,Math.round(bytes/1024))} KB`:`${(bytes/1024/1024).toFixed(1)} MB`;
    async function compressAvatar(file){
      if(!file.type.startsWith('image/'))throw Error('请选择图片文件。');
      const bitmap=await createImageBitmap(file);
      try{
        const longest=Math.max(bitmap.width,bitmap.height);
        if(file.size<=avatarTargetBytes&&longest<=4096&&['image/png','image/jpeg','image/webp'].includes(file.type))return file;
        let edge=Math.min(1400,longest),quality=.86,outputType='image/webp',lastBlob=null;
        for(let attempt=0;attempt<14;attempt++){
          const scale=Math.min(1,edge/longest),canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
          const context=canvas.getContext('2d');if(!context)throw Error('浏览器无法处理这张图片。');
          if(outputType==='image/jpeg'){context.fillStyle='#fffefa';context.fillRect(0,0,canvas.width,canvas.height)}
          context.drawImage(bitmap,0,0,canvas.width,canvas.height);
          const blob=await new Promise(resolve=>canvas.toBlob(resolve,outputType,quality));
          if(!blob)throw Error('图片压缩失败，请换一张图片再试。');
          if(outputType==='image/webp'&&blob.type!=='image/webp'){outputType='image/jpeg';quality=.86;continue}
          lastBlob=blob;
          if(blob.size<=avatarTargetBytes){const extension=outputType==='image/webp'?'webp':'jpg';return new File([blob],`avatar.${extension}`,{type:outputType,lastModified:Date.now()})}
          if(quality>.60)quality=Math.max(.60,quality-.08);else{edge=Math.max(256,Math.floor(edge*.75));quality=.86}
        }
        if(lastBlob&&lastBlob.size<=2*1024*1024){const extension=lastBlob.type==='image/webp'?'webp':'jpg';return new File([lastBlob],`avatar.${extension}`,{type:lastBlob.type,lastModified:Date.now()})}
        throw Error('这张图片无法压缩到上传限制内，请换一张图片。');
      }finally{bitmap.close?.()}
    }
    async function loadForumContent(tab='posts'){
      const box=document.getElementById('my-forum-content');
      try{
        const rows=await api(tab==='posts'?'/forum/mine/posts':'/forum/mine/bookmarks');
        box.innerHTML=rows.map(item=>`<a class="personal-community-item" href="/post.html?id=${item.id}"><span class="personal-community-icon">${tab==='posts'?'↗':'☆'}</span><span class="personal-community-copy"><b>${esc(item.title)}</b><small>${esc(item.category_name||'')} · ${tab==='posts'?({pending:'待审核',published:'已发布',rejected:'未通过'}[item.status]||item.status):esc(item.author_name||'')}</small></span><span class="personal-community-status ${item.status==='pending'?'is-pending':''}">${tab==='posts'?({pending:'审核中',published:'已发布',rejected:'未通过'}[item.status]||'查看'): '查看'}</span></a>`).join('')||'<div class="empty">这里还没有内容，去论坛看看吧。</div>';
      }catch(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`}
    }
    async function load(){
      try{
        profileData=await api('/me/profile');const user=profileData.user;
        document.getElementById('greeting').textContent='欢迎回来，'+user.name;
        const counts=profileData.platform_counts||{};
        document.getElementById('stats').innerHTML=`<div class="card profile-stat-card"><div class="stat-icon">✦</div><div class="label">累计 AC</div><div class="value">${profileData.total_count||0}</div><small>跨平台去重题数</small></div><div class="card profile-stat-card"><div class="stat-icon stat-blue">CF</div><div class="label">Codeforces</div><div class="value">${counts.codeforces||0}</div><small>已通过题目</small></div><div class="card profile-stat-card"><div class="stat-icon stat-green">At</div><div class="label">AtCoder</div><div class="value">${counts.atcoder||0}</div><small>已通过题目</small></div><div class="card profile-stat-card"><div class="stat-icon stat-warm">＋</div><div class="label">其他平台</div><div class="value">${Object.entries(counts).filter(([key])=>!['codeforces','atcoder'].includes(key)).reduce((sum,[,count])=>sum+count,0)}</div><small>洛谷、牛客与校 OJ</small></div>`;
        document.getElementById('profile-avatar-preview').src=user.avatar_url||'/assets/default-avatar.png';
        document.getElementById('profile').innerHTML=`<div class="binding-row"><span>社区昵称</span><b>${esc(user.name)}</b></div><div class="binding-row"><span>身份</span><b>${esc(user.status||'未设置')}</b></div><div class="binding-row"><span>Codeforces</span><b>${esc(user.cf_handle||'未绑定')}</b></div><div class="binding-row"><span>洛谷</span><b>${esc(user.luogu_id||'未绑定')}</b></div><div class="binding-row"><span>AtCoder</span><b>${esc(user.atcoder_handle||'未绑定')}</b></div><div class="binding-row"><span>牛客</span><b>${esc(user.nowcoder_id||'未绑定')}</b></div>`;
        document.getElementById('recent').innerHTML=(profileData.recent_ac||[]).slice(0,6).map(item=>`<div class="recent-ac-row"><span class="recent-ac-check">✓</span><span class="recent-ac-copy"><b>${esc(item.problem_name||item.problem_id)}</b><small>${esc(item.platform)} · ${esc(item.problem_rating||'难度未知')} · ${new Date(item.submit_time*1000).toLocaleDateString()}</small></span>${item.problem_url?`<a class="recent-ac-open" href="${esc(item.problem_url)}" target="_blank" rel="noopener noreferrer" aria-label="打开题目">↗</a>`:''}</div>`).join('')||'<div class="empty">暂无 AC 记录</div>';
      }catch(error){document.getElementById('recent').innerHTML=`<div class="empty">${esc(error.message)}</div>`}
      loadForumContent();
    }
    document.querySelectorAll('[data-forum-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-forum-tab]').forEach(item=>item.classList.toggle('active',item===button));loadForumContent(button.dataset.forumTab)});
    document.getElementById('edit-name').onclick=async()=>{const name=prompt('请输入新昵称',profileData?.user?.name||'');if(!name)return;try{await api('/me/profile',{method:'PUT',body:JSON.stringify({name})});await load()}catch(error){alert(error.message)}};
    document.getElementById('avatar-file').onchange=event=>{const file=event.target.files?.[0];if(file){const preview=document.getElementById('profile-avatar-preview');const localUrl=URL.createObjectURL(file);preview.onload=()=>URL.revokeObjectURL(localUrl);preview.src=localUrl}};
    document.getElementById('upload-avatar').onclick=async()=>{const file=document.getElementById('avatar-file').files?.[0];if(!file){alert('先选择一张头像图片。');return}const form=new FormData(),button=document.getElementById('upload-avatar'),note=document.getElementById('avatar-size-note');button.disabled=true;button.textContent='正在压缩…';note.textContent='正在优化图片，请稍候';try{const compressed=await compressAvatar(file);form.append('avatar',compressed,compressed.name);note.textContent=`图片已优化：${formatBytes(file.size)} → ${formatBytes(compressed.size)}`;button.textContent='正在上传…';await api('/me/avatar',{method:'POST',body:form});document.getElementById('avatar-file').value='';await load();note.textContent=`头像已更新（${formatBytes(compressed.size)}）`}catch(error){note.textContent='支持常见图片格式，上传时自动压缩';alert(error.message)}finally{button.disabled=false;button.textContent='上传头像'}};
    document.getElementById('reset-avatar').onclick=async()=>{try{await api('/me/avatar',{method:'DELETE'});document.getElementById('avatar-file').value='';await load()}catch(error){alert(error.message)}};
    window.PAGE_LOAD=load;
  </script>
</body>
</html>
