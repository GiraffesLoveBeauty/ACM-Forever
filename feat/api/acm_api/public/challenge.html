<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今日训练 · ACM Compass</title>
  <link rel="stylesheet" href="/assets/app.css?v=training-ground-4">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>✦</b> ACM Compass</div>
    <nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a class="active" href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">Daily practice</div><h1>今日训练</h1><span class="muted">每个平台使用自己的难度体系生成真实题目</span></div>
      <div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div>
    </header>
    <section class="card">
      <div class="filters">
        <select id="platform">
          <option value="">全部平台（不筛难度）</option><option value="codeforces">Codeforces</option>
          <option value="luogu">洛谷</option><option value="atcoder">AtCoder</option><option value="nowcoder">牛客</option>
        </select>
        <input id="tag" placeholder="算法标签 / 题名 / 题号">
        <input id="owner" placeholder="成员 QQ 号（可选）">
        <label class="chip"><input id="weak-tag" type="checkbox"> 按弱项训练</label>
        <span id="difficulty-wrap"><select id="difficulty" disabled><option value="">不限难度</option></select></span>
        <button class="btn primary" id="generate">重新生成今日训练</button>
      </div>
      <p class="muted" id="difficulty-help">请选择具体平台和对应难度；“全部平台”模式不应用难度筛选，也不会承诺训练区难度一致。</p>
    </section>
    <section class="grid three" style="margin-top:18px">
      <article class="card"><div class="label" id="foundation-label">巩固区 · 不限</div><h2>稳定基础</h2><p class="muted">低于目标难度，练习速度与完整度。</p><div id="foundation" class="empty">等待生成</div></article>
      <article class="card"><div class="label" id="core-label">同段区 · 不限</div><h2>主训练</h2><p class="muted">贴近目标难度，完成今天的核心训练。</p><div id="core" class="empty">等待生成</div></article>
      <article class="card"><div class="label" id="challenge-label">挑战区 · 不限</div><h2>突破上限</h2><p class="muted">略高于目标难度，试探新的能力边界。</p><div id="challenge" class="empty">等待生成</div></article>
    </section>
    <section class="card" style="margin-top:18px"><h2>挑战历史</h2><div id="history" class="list"><div class="empty">正在加载历史…</div></div></section>
  </main>
</div>
<div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div>
<script src="/assets/app.js?v=training-ground-4"></script>
<script>
const difficultySpecs={
  codeforces:{kind:'number',min:800,max:3500,step:100,value:1000,unit:'Rating',help:'Codeforces 使用数字 Rating，单区间匹配目标值 ±100。'},
  luogu:{kind:'select',values:['未评定','入门','普及-','普及/提高-','普及+/提高','提高+/省选-','省选/NOI-','NOI/NOI+/CTSC'],value:'普及-',help:'洛谷使用官方难度标签，三个训练区对应相邻等级。'},
  atcoder:{kind:'number',min:0,max:4000,step:100,value:800,unit:'Difficulty',help:'AtCoder 使用 AtCoder Problems 估算 Difficulty，单区间匹配目标值 ±100。'},
  nowcoder:{kind:'select',values:['1星','2星','3星','4星','5星'],value:'2星',help:'牛客使用题目难度星级，三个训练区对应相邻星级。'}
};
function selectedDifficulty(){const input=document.getElementById('difficulty');return input.value||null}
function zoneDifficulties(){
  const platform=document.getElementById('platform').value,spec=difficultySpecs[platform];
  if(!spec)return [null,null,null];
  const value=selectedDifficulty();
  if(spec.kind==='number'){const raw=Number(value);const base=Math.max(spec.min,Math.min(spec.max,Number.isFinite(raw)?raw:spec.value));return [Math.max(spec.min,base-150),base,Math.min(spec.max,base+150)]}
  const index=spec.values.indexOf(value);return [spec.values[Math.max(0,index-1)],value,spec.values[Math.min(spec.values.length-1,index+1)]]
}
function updateZoneLabels(){const values=zoneDifficulties();for(const [id,prefix,value] of [['foundation-label','巩固区',values[0]],['core-label','同段区',values[1]],['challenge-label','挑战区',values[2]]])document.getElementById(id).textContent=`${prefix} · ${value??'不限'}`}
function updateDifficultyControl(){
  const platform=document.getElementById('platform').value,spec=difficultySpecs[platform],wrap=document.getElementById('difficulty-wrap');
  if(!spec){wrap.innerHTML='<select id="difficulty" disabled><option value="">不限难度</option></select>';document.getElementById('difficulty-help').textContent='全部平台模式不应用难度筛选。';updateZoneLabels();return}
  if(spec.kind==='number')wrap.innerHTML=`<input id="difficulty" type="number" min="${spec.min}" max="${spec.max}" step="${spec.step}" value="${spec.value}" aria-label="${spec.unit}">`;
  else wrap.innerHTML=`<select id="difficulty">${spec.values.map(v=>`<option value="${esc(v)}"${v===spec.value?' selected':''}>${esc(v)}</option>`).join('')}</select>`;
  document.getElementById('difficulty-help').textContent=spec.help;document.getElementById('difficulty').addEventListener('change',updateZoneLabels);document.getElementById('difficulty').addEventListener('input',updateZoneLabels);updateZoneLabels()
}
async function load(){try{const d=await api('/challenge/list');document.getElementById('history').innerHTML=d.map(x=>`<div class="list-item"><span><b>${esc(x.problem_name||x.problem_id)}</b><br><small class="muted">${esc(x.platform)} · ${esc(x.status)} · 难度 ${esc(x.problem_rating??'未知')}</small></span><span class="muted">${esc(x.created_at)}</span></div>`).join('')||'<div class="empty">暂无挑战记录</div>'}catch(e){document.getElementById('history').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderCard(id,d){document.getElementById(id).innerHTML=d.success?`<b>${esc(d.problem_name||d.problem_id)}</b><br><span class="chip">${esc(d.platform)}</span> <span class="chip">难度 ${esc(d.problem_rating||'未知')}</span> <span class="chip">评分 ${esc(d.recommendation_score??'—')}</span> <span class="chip">${esc(d.tags||'无标签')}</span><br><small class="muted">${esc(d.recommendation_reason||'符合训练条件')}</small><br><a class="btn primary" style="display:inline-block;margin-top:12px" href="${esc(d.problem_url)}" target="_blank" rel="noopener noreferrer">打开题目 →</a>`:`<span class="muted">${esc(d.message||'暂无匹配题目')}</span>`}
async function generate(){const platform=document.getElementById('platform').value,tag=document.getElementById('tag').value,difficulty=document.getElementById('difficulty').value,owner_qq_id=document.getElementById('owner').value.trim(),weak_tag=document.getElementById('weak-tag').checked;if(platform&&!difficulty){document.getElementById('difficulty-help').textContent='请先选择当前平台的难度，避免生成与训练区标签不一致的题目。';return}const difficulties=zoneDifficulties();updateZoneLabels();let selectedWeakTag=tag;for(const [index,id] of ['foundation','core','challenge'].entries()){const el=document.getElementById(id);el.textContent='正在生成…';try{const d=await api('/challenge/start',{method:'POST',body:JSON.stringify({platform,tag:selectedWeakTag,difficulty:difficulties[index],owner_qq_id,weak_tag})});if(weak_tag&&d.weak_tag)selectedWeakTag=d.weak_tag;renderCard(id,d)}catch(e){el.textContent=e.message}}await load()}
document.getElementById('platform').addEventListener('change',updateDifficultyControl);document.getElementById('generate').onclick=generate;updateDifficultyControl();window.PAGE_LOAD=load;
</script>
</body>
</html>
