<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交时间线 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=community-photo-5"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a class="active" href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Submission timeline</div><h1>提交时间线</h1><span class="muted">查看真实提交事件、平台分布和训练连续天数</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="filters"><input id="owner" placeholder="用户 QQ 号"><input id="problem" placeholder="题目 ID（可选）"><button class="btn primary" id="query">查询</button></div><div id="summary" class="grid three"></div><div id="list" class="list"><div class="empty">请输入 QQ 号后查询</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=community-photo-5"></script><script>async function loadTimeline(){const owner=$('#owner').value.trim();if(!owner)return;try{const[d,a,t]=await Promise.all([api('/submissions/attempts?owner_qq_id='+encodeURIComponent(owner)),api('/submissions/analytics?owner_qq_id='+encodeURIComponent(owner)),api('/training/summary?owner_qq_id='+encodeURIComponent(owner))]);$('#summary').innerHTML='<div class="card"><span class="label">连续训练</span><h2>'+t.streak_days+' 天</h2></div><div class="card"><span class="label">活跃天数</span><h2>'+t.active_days+'</h2></div><div class="card"><span class="label">平台数</span><h2>'+a.platforms.length+'</h2></div>';const q=$('#problem').value.trim().toLowerCase();$('#list').innerHTML=d.filter(x=>!q||String(x.problem_id).toLowerCase().includes(q)).map(x=>'<div class="list-item"><span><b>'+esc(x.platform)+' · '+esc(x.problem_id)+'</b><br><small>'+esc(x.verdict||'')+' · '+esc(x.language||'')+' · '+new Date(x.submitted_at*1000).toLocaleString()+'</small></span><span class="muted">'+(x.source_code?'源码可用':'仅元数据')+'</span></div>').join('')||'<div class="empty">暂无提交版本记录</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('#query').onclick=loadTimeline;window.PAGE_LOAD=function(){};</script></body></html>
