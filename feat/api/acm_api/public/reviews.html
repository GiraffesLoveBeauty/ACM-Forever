<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待复盘 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=palette-theme-3"></head><body><div class="app"><aside class="sidebar"><div class="brand"><b>✦</b> ACM Compass</div><nav class="nav"><a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a><a href="/challenge.html">◎ 今日训练</a><a class="active" href="/reviews.html">✓ 待复盘</a><a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a><a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a><a href="/contest-review.html">◈ 赛事复盘</a><a href="/settings.html">⚙ 设置</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Review queue</div><h1>待复盘</h1><span class="muted">从已有提交记录中找到最近值得回看的题目</span></div><div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div></header><section class="card"><div class="filters"><input id="owner" placeholder="用户 QQ 号"><select id="mode"><option value="due">智能复习</option><option value="all">全部已刷</option><option value="hard">困难题</option><option value="favorite">已收藏</option></select><button class="btn primary" id="refresh">加载复习队列</button></div><div id="summary" class="muted"></div><div id="weak-tags" class="chips"></div><div id="members" class="list"><div class="empty">请输入 QQ 号后加载复习队列</div></div></section></main></div><div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div><script src="/assets/app.js?v=palette-theme-3"></script><script>
let reviewRows=[];
async function load(){const owner=document.getElementById('owner').value.trim();if(!owner)return;const box=document.getElementById('members');box.innerHTML='<div class="empty">正在加载智能复习队列…</div>';try{const [reviews,weak]=await Promise.all([api('/review/queue?owner_qq_id='+encodeURIComponent(owner)),api('/training/weak-tags?owner_qq_id='+encodeURIComponent(owner))]);reviewRows=reviews;document.getElementById('weak-tags').innerHTML=(weak.tags||[]).map(x=>`<span class="chip">${esc(x.tag)} · 掌握度 ${(Number(x.mastery||0)*100).toFixed(0)}%</span>`).join('')||'<span class="muted">暂无标签数据</span>';renderReviews()}catch(e){box.innerHTML='<div class="empty">复习队列加载失败：'+esc(e.message)+'</div>'}}
function renderReviews(){const mode=document.getElementById('mode').value;const now=Math.floor(Date.now()/1000);const rows=reviewRows.filter(x=>mode==='due'?(x.due_at&&x.due_at<=now):mode==='hard'?x.mistakes>0:mode==='favorite'?Boolean(x.is_favorite):true);document.getElementById('summary').textContent='共 '+rows.length+' 道待复盘题目';document.getElementById('members').innerHTML=rows.map(x=>`<article class="list-item"><span><b>${esc(x.platform)} · ${esc(x.problem_id)}</b><br><strong>${esc(x.problem_name||'未命名题目')}</strong><br><small class="muted">${x.queue_type==='upsolve'?'比赛补题 · '+(x.contest_id||'未知比赛'):''} Rating ${esc(x.problem_rating||'未知')} · AC ${esc(x.attempts||0)} 次 · 标签 ${esc(x.tags||'无')} · ${x.due_at&&x.due_at<=now?'今天到期':'待安排'}</small></span><span class="chips"><button class="btn" onclick="feedback('${esc(x.platform)}','${esc(x.problem_id)}','again')">重来</button><button class="btn" onclick="feedback('${esc(x.platform)}','${esc(x.problem_id)}','hard')">困难</button><button class="btn" onclick="feedback('${esc(x.platform)}','${esc(x.problem_id)}','good')">掌握</button><button class="btn primary" onclick="feedback('${esc(x.platform)}','${esc(x.problem_id)}','easy')">轻松</button></span></article>`).join('')||'<div class="empty">当前没有符合条件的复习题目</div>'}
async function feedback(platform,problem_id,grade){try{await api('/review/feedback',{method:'POST',body:JSON.stringify({owner_qq_id:document.getElementById('owner').value.trim(),platform,problem_id,grade})});await load()}catch(e){alert(e.message)}}document.getElementById('refresh').onclick=load;document.getElementById('mode').onchange=renderReviews;window.PAGE_LOAD=function(){};
</script></body></html>
