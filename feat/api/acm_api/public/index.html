<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ACM Compass</title><link rel="stylesheet" href="/assets/app.css?v=member-auth-1"></head>
<body>
  <main id="login" class="login">
    <section class="card">
      <div class="brand"><b>✦</b> ACM Compass</div>
      <h1>登录训练工作台</h1>
      <p class="muted">成员使用 QQ 号和管理员发放的初始密码登录。</p>
      <form id="login-form">
        <label for="username">QQ 号</label><input id="username" autocomplete="username" inputmode="numeric" placeholder="请输入 QQ 号或旧管理员账号" required>
        <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">登录</button>
        <div id="login-message" class="muted" role="status"></div>
      </form>
      <small class="muted">管理员账号迁移期间可使用旧管理员账号登录。</small>
    </section>
  </main>
  <script src="/assets/app.js?v=member-auth-1"></script>
</body>
</html>
