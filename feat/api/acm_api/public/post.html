<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>话题 · ACM Forever</title><link rel="stylesheet" href="/assets/app.css?v=local-css-mime-fix-1"><link rel="stylesheet" href="/assets/forum.css?v=forum-post-actions-2"></head>
<body class="forum-page">
  <header class="forum-header"><a class="forum-brand" href="/index.html"><img class="icpc-brand-logo" src="/assets/icpc-logo.png" alt="ICPC 官方标志"><span>ACM <b>Forever</b><small>计量 ACMer 学习社区</small></span></a><nav class="nav primary-nav" aria-label="主导航"></nav><div class="forum-header-actions"><button class="btn" id="theme-toggle" aria-label="切换主题">◐</button><a class="btn" id="login-link" href="/login.html">登录</a><button class="btn" id="logout" style="display:none">退出</button></div></header>
  <main class="forum-post-layout"><a class="forum-back-link" href="/index.html">← 返回论坛</a><div class="forum-post-columns"><aside class="forum-author-rail" id="author-rail" aria-label="作者与话题信息"></aside><article class="forum-post-detail" id="post-detail"><div class="forum-loading"><span class="spinner"></span>正在加载话题…</div></article><aside class="forum-detail-rail"><section class="forum-rail-card forum-toc-card"><div class="forum-side-title">文章目录</div><nav id="post-toc" class="forum-toc" aria-label="文章目录"><p class="muted">目录将在正文加载后显示。</p></nav></section><section class="forum-rail-card forum-discussion-card"><div class="forum-side-title">参与讨论</div><p class="muted">友善交流，补充清晰的问题背景与思路，让讨论更有帮助。</p><button class="btn primary forum-write" id="focus-comment">写下你的想法</button></section><a class="forum-rank-link" href="/leaderboard.html">♛　查看社区刷题榜</a></aside></div></main>
  <div class="forum-toast" id="forum-toast" role="status"></div>
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css?v=0.19.0">
  <script src="/assets/vendor/marked.min.js"></script><script src="/assets/vendor/purify.min.js"></script><script src="/assets/vendor/katex/katex.min.js?v=0.19.0"></script><script src="/assets/vendor/katex/auto-render.min.js?v=0.19.0"></script><script src="/assets/forum-markdown.js?v=forum-math-6"></script><script src="/assets/app.js?v=forum-header-avatar-6"></script>
  <script>
    const postId=new URLSearchParams(location.search).get('id');let detailData=null;
    const toast=message=>{const node=document.getElementById('forum-toast');node.textContent=message;node.classList.add('visible');setTimeout(()=>node.classList.remove('visible'),2600)};
    function renderComments(items){const roots=items.filter(item=>!item.parent_id);if(!roots.length)return '<div class="forum-empty comments-empty"><span>☁</span><p>还没有评论，来开启第一轮讨论吧。</p></div>';return roots.map(item=>`<article class="forum-comment"><div class="forum-post-author">${avatarMarkup(item.author_avatar_url,item.author_name,'forum-avatar small')}<b>${esc(item.author_name||'ACM 成员')}</b><time>${new Date(item.created_at*1000).toLocaleString()}</time></div><p>${esc(item.body)}</p><button class="forum-reply-button" data-reply="${item.id}">回复</button>${items.filter(reply=>Number(reply.parent_id)===Number(item.id)).map(reply=>`<div class="forum-comment-reply"><div class="forum-post-author">${avatarMarkup(reply.author_avatar_url,reply.author_name,'forum-avatar small')}<b>${esc(reply.author_name||'ACM 成员')}</b><time>${new Date(reply.created_at*1000).toLocaleString()}</time></div><p>${esc(reply.body)}</p></div>`).join('')}</article>`).join('')}
    function renderPost(data){document.title=`${data.title} · ACM Forever`;const author=data.author_name||'ACM 成员';const comments=Array.isArray(data.comments)?data.comments:[];document.getElementById('author-rail').innerHTML=`<section class="forum-author-card"><div class="forum-author-card-label">本帖作者</div>${avatarMarkup(data.author_avatar_url,author,'forum-avatar forum-author-avatar')}<b class="forum-author-name">${esc(author)}</b><span class="forum-author-caption">计量 ACMer · 社区成员</span><div class="forum-author-divider"></div><div class="forum-author-stats"><div><b>${Number(data.likes_count||0)}</b><span>获赞</span></div><div><b>${Number(data.views_count||0)}</b><span>人气</span></div><div><b>${comments.length}</b><span>评论</span></div></div><div class="forum-author-date">发布于 ${new Date(data.created_at*1000).toLocaleDateString()}</div></section>`;document.getElementById('post-detail').innerHTML=`<article class="forum-article"><div class="forum-post-meta"><span class="forum-category-pill">${esc(data.category_name)}</span>${data.is_pinned?'<span class="forum-pinned">置顶</span>':''}<span class="forum-article-date">${new Date(data.created_at*1000).toLocaleString()}</span></div><h1>${esc(data.title)}</h1><div class="forum-article-byline">${avatarMarkup(data.author_avatar_url,author,'forum-avatar small')}<b>${esc(author)}</b></div><div class="forum-article-body forum-markdown">${window.renderForumMarkdown(data.body)}</div><div class="forum-detail-actions"><button class="btn ${data.viewer_liked?'is-active':''}" id="detail-like">${data.viewer_liked?'♥':'♡'} ${Number(data.likes_count||0)} 赞</button><button class="btn ${data.viewer_bookmarked?'is-active':''}" id="detail-bookmark">${data.viewer_bookmarked?'★ 已收藏':'☆ 收藏'}</button><button class="btn" id="report-post">举报</button>${data.viewer_is_author?'<button class="btn forum-delete-post" id="delete-post">删除帖子</button>':''}<span>◉ ${Number(data.views_count||0)} 阅读</span></div></article><section class="forum-comments" id="comments"><div class="forum-comments-heading"><h2>讨论区</h2><span>${comments.length} 条评论</span></div><form class="forum-comment-form" id="comment-form"><textarea id="comment-body" rows="3" placeholder="写下你的问题、想法或补充…"></textarea><div class="forum-comment-form-bottom"><span id="reply-hint" class="muted"></span><button class="btn primary" type="submit">发布评论</button></div></form><div id="comment-list">${renderComments(comments)}</div></section>`;renderPostToc();window.renderForumMath(document.querySelector('.forum-article-body'));
      let parentId=0;document.querySelectorAll('[data-reply]').forEach(button=>button.onclick=()=>{parentId=Number(button.dataset.reply);document.getElementById('reply-hint').textContent='正在回复评论 · 取消回复';document.getElementById('reply-hint').onclick=()=>{parentId=0;document.getElementById('reply-hint').textContent=''};document.getElementById('comment-body').focus()});
      document.getElementById('comment-form').onsubmit=async event=>{event.preventDefault();if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search+'#comments');return}const input=document.getElementById('comment-body');try{await api(`/forum/posts/${postId}/comments`,{method:'POST',body:JSON.stringify({body:input.value,parent_id:parentId})});input.value='';parentId=0;document.getElementById('reply-hint').textContent='';detailData=await api(`/forum/posts/${postId}`);renderPost(detailData);document.getElementById('comments').scrollIntoView({behavior:'smooth'})}catch(error){toast(error.message)}};
      document.getElementById('detail-like').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}try{await api(`/forum/posts/${postId}/like`,{method:'POST'});detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){toast(error.message)}};
      document.getElementById('detail-bookmark').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}try{await api(`/forum/posts/${postId}/bookmark`,{method:'POST'});detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){toast(error.message)}};
      document.getElementById('report-post').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}const reason=prompt('请简要说明举报原因');if(!reason)return;try{await api(`/forum/posts/${postId}/report`,{method:'POST',body:JSON.stringify({reason})});toast('已提交举报，管理员会进行核查。')}catch(error){toast(error.message)}};
      const deleteButton=document.getElementById('delete-post');if(deleteButton)deleteButton.onclick=async()=>{if(!confirm('确定删除这篇帖子吗？删除后会从论坛中移除。'))return;deleteButton.disabled=true;try{await api(`/forum/posts/${postId}`,{method:'DELETE'});toast('帖子已删除');setTimeout(()=>location.href='/index.html',700)}catch(error){deleteButton.disabled=false;toast(error.message)}};
    }
    function renderPostToc(){const body=document.querySelector('.forum-article-body');const toc=document.getElementById('post-toc');if(!body||!toc)return;const headings=[...body.querySelectorAll('h1,h2,h3')];if(!headings.length){toc.innerHTML='<p class="muted forum-toc-empty">这篇文章还没有分级标题。</p>';return}toc.innerHTML=`<ol>${headings.map((heading,index)=>{const id=`post-section-${index+1}`;heading.id=id;return `<li class="forum-toc-level-${heading.tagName.slice(1)}"><a href="#${id}">${esc(heading.textContent.trim()||`章节 ${index+1}`)}</a></li>`}).join('')}</ol>`;toc.querySelectorAll('a').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();const target=document.getElementById(decodeURIComponent(link.hash.slice(1)));target?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',link.hash)}));if('IntersectionObserver'in window){const links=[...toc.querySelectorAll('a')];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){links.forEach(link=>link.classList.toggle('active',link.hash===`#${entry.target.id}`))}}),{rootMargin:'-12% 0px -72% 0px'});headings.forEach(heading=>observer.observe(heading))}}
    document.getElementById('focus-comment').onclick=()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search+'#comments');return}document.getElementById('comment-body')?.focus();document.getElementById('comments')?.scrollIntoView({behavior:'smooth'})};
    window.PAGE_LOAD=async()=>{if(!AUTH.authenticated){document.getElementById('login-link').textContent='登录后参与';}else{document.getElementById('login-link').textContent=AUTH.role==='member'?'个人中心':'管理中心';document.getElementById('login-link').href=AUTH.role==='member'?'/home.html':'/admin.html';document.getElementById('logout').style.display=''}if(!postId){document.getElementById('post-detail').innerHTML='<div class="forum-empty">没有指定话题。</div>';return}try{detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){document.getElementById('post-detail').innerHTML=`<div class="forum-empty"><h2>话题暂时无法打开</h2><p>${esc(error.message)}</p><a class="btn" href="/index.html">回到论坛</a></div>`}};
  </script>
</body>
</html>
