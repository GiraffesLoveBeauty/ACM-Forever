<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>话题 · ACM Forever</title><link rel="stylesheet" href="/assets/app.css?v=icpc-brand-6"><link rel="stylesheet" href="/assets/forum.css?v=icpc-brand-6"></head>
<body class="forum-page">
  <header class="forum-header"><a class="forum-brand" href="/index.html"><img class="icpc-brand-logo" src="/assets/icpc-logo.png" alt="ICPC 官方标志"><span>ACM <b>Forever</b><small>计量 ACMer 学习社区</small></span></a><nav class="nav primary-nav" aria-label="主导航"></nav><div class="forum-header-actions"><button class="btn" id="theme-toggle" aria-label="切换主题">◐</button><a class="btn" id="login-link" href="/login.html">登录</a><button class="btn" id="logout" style="display:none">退出</button></div></header>
  <main class="forum-post-layout"><a class="forum-back-link" href="/index.html">← 返回论坛</a><div class="forum-post-columns"><article class="forum-post-detail" id="post-detail"><div class="forum-loading"><span class="spinner"></span>正在加载话题…</div></article><aside class="forum-detail-rail"><section class="forum-rail-card"><div class="forum-side-title">参与讨论</div><p class="muted">友善交流，补充清晰的问题背景与思路，让讨论更有帮助。</p><button class="btn primary forum-write" id="focus-comment">写下你的想法</button></section><a class="forum-rank-link" href="/leaderboard.html">♛　查看社区刷题榜</a></aside></div></main>
  <div class="forum-toast" id="forum-toast" role="status"></div>
  <script src="/assets/app.js?v=icpc-brand-6"></script>
  <script>
    const postId=new URLSearchParams(location.search).get('id');let detailData=null;
    const toast=message=>{const node=document.getElementById('forum-toast');node.textContent=message;node.classList.add('visible');setTimeout(()=>node.classList.remove('visible'),2600)};
    function renderComments(items){const roots=items.filter(item=>!item.parent_id);if(!roots.length)return '<div class="forum-empty comments-empty"><span>☁</span><p>还没有评论，来开启第一轮讨论吧。</p></div>';return roots.map(item=>`<article class="forum-comment"><div class="forum-post-author"><span class="forum-avatar small">${esc((item.author_name||'A').slice(0,1))}</span><b>${esc(item.author_name||'ACM 成员')}</b><time>${new Date(item.created_at*1000).toLocaleString()}</time></div><p>${esc(item.body)}</p><button class="forum-reply-button" data-reply="${item.id}">回复</button>${items.filter(reply=>Number(reply.parent_id)===Number(item.id)).map(reply=>`<div class="forum-comment-reply"><div class="forum-post-author"><span class="forum-avatar small">${esc((reply.author_name||'A').slice(0,1))}</span><b>${esc(reply.author_name||'ACM 成员')}</b><time>${new Date(reply.created_at*1000).toLocaleString()}</time></div><p>${esc(reply.body)}</p></div>`).join('')}</article>`).join('')}
    function renderPost(data){document.title=`${data.title} · ACM Forever`;document.getElementById('post-detail').innerHTML=`<article class="forum-article"><div class="forum-post-meta"><span class="forum-category-pill">${esc(data.category_name)}</span>${data.is_pinned?'<span class="forum-pinned">置顶</span>':''}</div><h1>${esc(data.title)}</h1><div class="forum-post-author"><span class="forum-avatar">${esc((data.author_name||'A').slice(0,1))}</span><span>${esc(data.author_name||'ACM 成员')}</span><span class="forum-post-author-dot">·</span><span>${new Date(data.created_at*1000).toLocaleString()}</span></div><div class="forum-article-body">${esc(data.body)}</div><div class="forum-detail-actions"><button class="btn ${data.viewer_liked?'is-active':''}" id="detail-like">${data.viewer_liked?'♥':'♡'} ${Number(data.likes_count||0)} 赞</button><button class="btn ${data.viewer_bookmarked?'is-active':''}" id="detail-bookmark">${data.viewer_bookmarked?'★ 已收藏':'☆ 收藏'}</button><button class="btn" id="report-post">举报</button><span>◉ ${Number(data.views_count||0)} 阅读</span></div></article><section class="forum-comments" id="comments"><div class="forum-comments-heading"><h2>讨论区</h2><span>${data.comments.length} 条评论</span></div><form class="forum-comment-form" id="comment-form"><textarea id="comment-body" rows="3" placeholder="写下你的问题、想法或补充…"></textarea><div class="forum-comment-form-bottom"><span id="reply-hint" class="muted"></span><button class="btn primary" type="submit">发布评论</button></div></form><div id="comment-list">${renderComments(data.comments)}</div></section>`;
      let parentId=0;document.querySelectorAll('[data-reply]').forEach(button=>button.onclick=()=>{parentId=Number(button.dataset.reply);document.getElementById('reply-hint').textContent='正在回复评论 · 取消回复';document.getElementById('reply-hint').onclick=()=>{parentId=0;document.getElementById('reply-hint').textContent=''};document.getElementById('comment-body').focus()});
      document.getElementById('comment-form').onsubmit=async event=>{event.preventDefault();if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search+'#comments');return}const input=document.getElementById('comment-body');try{await api(`/forum/posts/${postId}/comments`,{method:'POST',body:JSON.stringify({body:input.value,parent_id:parentId})});input.value='';parentId=0;document.getElementById('reply-hint').textContent='';detailData=await api(`/forum/posts/${postId}`);renderPost(detailData);document.getElementById('comments').scrollIntoView({behavior:'smooth'})}catch(error){toast(error.message)}};
      document.getElementById('detail-like').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}try{await api(`/forum/posts/${postId}/like`,{method:'POST'});detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){toast(error.message)}};
      document.getElementById('detail-bookmark').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}try{await api(`/forum/posts/${postId}/bookmark`,{method:'POST'});detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){toast(error.message)}};
      document.getElementById('report-post').onclick=async()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}const reason=prompt('请简要说明举报原因');if(!reason)return;try{await api(`/forum/posts/${postId}/report`,{method:'POST',body:JSON.stringify({reason})});toast('已提交举报，管理员会进行核查。')}catch(error){toast(error.message)}};
    }
    document.getElementById('focus-comment').onclick=()=>{if(!AUTH.authenticated){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search+'#comments');return}document.getElementById('comment-body')?.focus();document.getElementById('comments')?.scrollIntoView({behavior:'smooth'})};
    window.PAGE_LOAD=async()=>{if(!AUTH.authenticated){document.getElementById('login-link').textContent='登录后参与';}else{document.getElementById('login-link').textContent=AUTH.role==='member'?'个人中心':'管理中心';document.getElementById('login-link').href=AUTH.role==='member'?'/home.html':'/admin.html';document.getElementById('logout').style.display=''}if(!postId){document.getElementById('post-detail').innerHTML='<div class="forum-empty">没有指定话题。</div>';return}try{detailData=await api(`/forum/posts/${postId}`);renderPost(detailData)}catch(error){document.getElementById('post-detail').innerHTML=`<div class="forum-empty"><h2>话题暂时无法打开</h2><p>${esc(error.message)}</p><a class="btn" href="/index.html">回到论坛</a></div>`}};
  </script>
</body>
</html>
