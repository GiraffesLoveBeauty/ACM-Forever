<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置 · ACM Compass</title>
  <link rel="stylesheet" href="/assets/app.css?v=forum-directory-7">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>✦</b> ACM Compass</div>
      <nav class="nav">
        <a href="/index.html">⌂ 总览</a><a href="/leaderboard.html">♛ 排行榜</a>
        <a href="/challenge.html">◎ 今日训练</a><a href="/reviews.html">✓ 待复盘</a>
        <a href="/tasks.html">↻ 同步任务</a><a href="/problem-bank.html">▦ 题库工作台</a>
        <a href="/submissions.html">◷ 提交时间线</a><a href="/workspace.html">✎ 笔记与目标</a>
        <a href="/contest-review.html">◈ 赛事复盘</a><a class="active" href="/settings.html">⚙ 设置</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">Settings</div><h1>设置</h1><span class="muted">外观与 ACM 管理员配置</span></div>
        <div class="userbar"><button class="btn" id="theme-toggle">◐</button><button class="btn" id="logout">退出</button></div>
      </header>
      <section class="card">
        <h2>界面设置</h2>
        <label>入口顺序（逗号分隔）</label><input id="order" value="index,leaderboard,challenge,reviews,tasks,problem-bank,submissions,workspace,contest-review,settings">
        <label>隐藏入口（逗号分隔）</label><input id="hidden">
        <label>字号比例</label><input id="scale" type="number" min="0.8" max="1.5" step="0.05" value="1">
        <label><input id="full" type="checkbox"> 使用全页赛事复盘布局</label><br>
        <button class="btn primary" onclick="savePreferences()">保存界面设置</button><span id="msg" class="muted"></span>
      </section>
      <section class="card">
        <h2>近期比赛定时播报</h2>
        <p class="muted">每天按北京时间播报最近 5 场 Codeforces 比赛。播报发送到机器人已配置的通知群；未设置时间时功能关闭。</p>
        <label for="contest-time">播报时间（24 小时制 HH:MM）</label>
        <div class="filters"><input id="contest-time" type="time"><button class="btn primary" onclick="saveContestReport()">保存时间</button><button class="btn" onclick="disableContestReport()">关闭播报</button></div>
        <div id="contest-report-msg" class="muted"></div>
      </section>
      <section class="card">
        <h2>ACM 管理员</h2>
        <p class="muted">全局 root 始终拥有权限且不能从此处删除；新增管理员用于 QQ 群中的 ACM 管理命令。</p>
        <div id="root-list" class="list"><div class="empty">正在加载…</div></div>
        <label for="new-admin">添加管理员 QQ 号</label>
        <div class="filters"><input id="new-admin" inputmode="numeric" placeholder="4-12 位数字"><button class="btn" onclick="addAdmin()">添加</button></div>
        <div id="admin-list" class="list"></div>
        <button class="btn primary" onclick="saveAdmins()">保存管理员</button><span id="admin-msg" class="muted"></span>
      </section>
    </main>
  </div>
  <div id="login" class="login" style="display:none"><form id="login-form"><h2>登录</h2><input id="username" required><input id="password" type="password" required><button class="btn primary">登录</button></form></div>
  <script src="/assets/app.js?v=forum-directory-7"></script>
  <script>
    let adminState={root:[],admins:[]};
    async function load(){
      const d=await api('/ui/preferences');
      $('#order').value=(d.nav_order||[]).join(',');$('#hidden').value=(d.nav_hidden||[]).join(',');$('#scale').value=d.font_scale||1;$('#full').checked=!!d.review_full_page;
      const contest=await api('/settings/contest-report');$('#contest-time').value=contest.time||'';
      adminState=await api('/admins');renderAdmins();
    }
    function renderAdmins(){
      $('#root-list').innerHTML=(adminState.root||[]).map(id=>`<div class="list-item"><span>🔒 全局 root</span><b>${esc(id)}</b></div>`).join('')||'<div class="empty">未读取到全局 root</div>';
      $('#admin-list').innerHTML=(adminState.admins||[]).map((id,i)=>`<div class="list-item"><span>QQ ${esc(id)}</span><button class="btn" onclick="removeAdmin(${i})">删除</button></div>`).join('')||'<div class="empty">暂无额外管理员</div>';
    }
    function addAdmin(){const input=$('#new-admin'),id=input.value.trim();if(!/^\d{4,12}$/.test(id)){show('#admin-msg','请输入 4-12 位数字 QQ 号');return}if(!adminState.admins.includes(id)&&!adminState.root.includes(id))adminState.admins.push(id);input.value='';renderAdmins()}
    function removeAdmin(i){adminState.admins.splice(i,1);renderAdmins()}
    async function saveAdmins(){try{const d=await api('/admins',{method:'PUT',body:JSON.stringify({admins:adminState.admins})});adminState=d;renderAdmins();show('#admin-msg','管理员配置已保存')}catch(e){show('#admin-msg',e.message)}}
    async function savePreferences(){try{await api('/ui/preferences',{method:'PUT',body:JSON.stringify({nav_order:$('#order').value.split(',').map(x=>x.trim()).filter(Boolean),nav_hidden:$('#hidden').value.split(',').map(x=>x.trim()).filter(Boolean),font_scale:$('#scale').value,review_full_page:$('#full').checked})});show('#msg','界面设置已保存')}catch(e){show('#msg',e.message)}}
    async function saveContestReport(){try{const value=$('#contest-time').value;if(!value)throw Error('请先选择时间，或使用“关闭播报”');const result=await api('/settings/contest-report',{method:'PUT',body:JSON.stringify({time:value})});show('#contest-report-msg',result.group_id?'已保存，每天 '+value+' 播报到通知群':'已保存时间；还未配置通知群，请在 QQ 中使用 /acm set group <群号>');}catch(e){show('#contest-report-msg',e.message)}}
    async function disableContestReport(){try{await api('/settings/contest-report',{method:'PUT',body:JSON.stringify({time:''})});$('#contest-time').value='';show('#contest-report-msg','近期比赛定时播报已关闭')}catch(e){show('#contest-report-msg',e.message)}}
    function show(s,t){$(s).textContent=t;setTimeout(()=>$(s).textContent='',4000)}
    const PAGE_LOAD=load;
  </script>
</body>
</html>
