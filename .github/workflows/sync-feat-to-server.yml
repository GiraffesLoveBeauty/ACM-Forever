# Required repository secrets:
# - ACM_FOREVER_SERVER_SSH_KEY: private SSH key authorized for root@118.178.192.81.
# - ACM_FOREVER_SERVER_FINGERPRINT: trusted SHA256 fingerprint of the server's SSH host key.
name: Sync feat directory to server

on:
  push:
    branches:
      - main
    paths:
      - 'feat/**'
      - '.github/workflows/sync-feat-to-server.yml'
  workflow_dispatch:
    inputs:
      start_service:
        description: 'Start the service after deployment (leave off until data migration is complete)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: acm-forever-feat-sync
  cancel-in-progress: false

env:
  SERVER_HOST: 118.178.192.81
  SERVER_USER: root
  SERVER_PORT: 22
  ARCHIVE_NAME: acm-forever-feat.tar.gz

jobs:
  sync:
    name: Sync feat directory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACM_DEPLOY_START_SERVICE: ${{ github.event_name != 'workflow_dispatch' || inputs.start_service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.ACM_FOREVER_SERVER_SSH_KEY }}
          SERVER_FINGERPRINT: ${{ secrets.ACM_FOREVER_SERVER_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_SSH_KEY" ] || [ -z "$SERVER_FINGERPRINT" ]; then
            echo "::error::Set ACM_FOREVER_SERVER_SSH_KEY and ACM_FOREVER_SERVER_FINGERPRINT in repository Actions secrets."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"

      - name: Build Vue frontend
        working-directory: feat/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify server connection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if timeout 5 bash -c "</dev/tcp/${SERVER_HOST}/${SERVER_PORT}" 2>/dev/null; then
              echo "Server is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Unable to reach ${SERVER_HOST}:${SERVER_PORT} over public SSH. Check the server security group and firewall."
          exit 1

      - name: Package feat directory
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='node_modules' --exclude='.pnpm-store' --exclude='__pycache__' --exclude='./data' -czf "${ARCHIVE_NAME}" -C feat .
          test -s "${ARCHIVE_NAME}"
          tar -tzf "${ARCHIVE_NAME}" >/dev/null

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.ACM_FOREVER_SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.ACM_FOREVER_SERVER_FINGERPRINT }}
          port: ${{ env.SERVER_PORT }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /root/
          overwrite: true
          timeout: 60s
          command_timeout: 5m

      - name: Install feat directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.ACM_FOREVER_SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.ACM_FOREVER_SERVER_FINGERPRINT }}
          port: ${{ env.SERVER_PORT }}
          timeout: 60s
          command_timeout: 15m
          envs: ACM_DEPLOY_START_SERVICE
          script: |
            set -eu

            if [ "$(id -u)" -ne 0 ]; then
              echo "Deployment must run as root."
              exit 1
            fi
            for executable in python3 curl tar systemctl; do
              if ! command -v "$executable" >/dev/null 2>&1; then
                echo "Missing server dependency: $executable. See docs/public-server-deployment.md."
                exit 1
              fi
            done

            target="/root/acm-forever-feat"
            archive="/root/acm-forever-feat.tar.gz"
            data_dir="/root/acm-forever-data"
            env_file="$data_dir/.env"
            service_dir="/etc/systemd/system"
            start_service="${ACM_DEPLOY_START_SERVICE:-true}"
            case "$start_service" in
              true|false) ;;
              *) echo "Invalid ACM_DEPLOY_START_SERVICE value."; exit 1 ;;
            esac
            if [ "$start_service" = true ] && [ ! -s "$env_file" ]; then
              echo "Create $env_file and restore the database/uploads before starting the service."
              exit 1
            fi
            if [ "$start_service" = false ] && systemctl is-active --quiet acm-forever-webui.service; then
              echo "The service is already running. Enable start_service for a normal deployment."
              exit 1
            fi

            stage="$(mktemp -d /root/.acm-forever-feat.stage.XXXXXX)"
            backup="/root/.acm-forever-feat.backup.$$"
            had_previous=0

            cleanup() {
              status=$?
              if [ "$status" -ne 0 ] && [ "$had_previous" -eq 1 ] && [ ! -e "$target" ] && [ -e "$backup" ]; then
                mv "$backup" "$target"
              fi
              rm -rf "$stage"
              rm -f "$archive"
              if [ "$status" -eq 0 ] && [ "$had_previous" -eq 1 ]; then
                rm -rf "$backup"
              fi
              exit "$status"
            }
            trap cleanup EXIT

            test -s "$archive"
            tar -tzf "$archive" >/dev/null
            tar -xzf "$archive" -C "$stage"
            test -s "$stage/web/dist/index.html"
            test -s "$stage/api/deploy/acm-forever-webui.service"

            mkdir -p "$data_dir" "$service_dir"
            if [ ! -x "$data_dir/venv/bin/python" ]; then
              python3 -m venv "$data_dir/venv"
            fi
            "$data_dir/venv/bin/python" -m pip install -r "$stage/api/requirements.txt"

            if [ -e "$target" ]; then
              mv "$target" "$backup"
              had_previous=1
            fi
            mv "$stage" "$target"
            echo "Synced feat directory to $target"

            service_source="$target/api/deploy/acm-forever-webui.service"
            install -m 0644 "$service_source" "$service_dir/acm-forever-webui.service"
            systemctl daemon-reload
            if [ "$start_service" = false ]; then
              echo "Code, dependencies and systemd unit installed. Service startup was explicitly disabled."
              echo "Restore the database/uploads, configure $env_file, then rerun with start_service enabled."
              exit 0
            fi

            systemctl enable acm-forever-webui.service
            systemctl restart acm-forever-webui.service
            for attempt in $(seq 1 20); do
              if systemctl is-active --quiet acm-forever-webui.service \
                && curl --fail --silent --show-error --max-time 3 \
                  http://127.0.0.1:8088/health >/dev/null; then
                echo "ACM-Forever WebUI is healthy on port 8088."
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "ACM-Forever WebUI failed to become healthy. Recent service log:"
                journalctl -u acm-forever-webui.service -n 60 --no-pager
                exit 1
              fi
              sleep 2
            done
