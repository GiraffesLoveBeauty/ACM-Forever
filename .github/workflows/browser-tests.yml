name: Browser regression

on:
  pull_request:
    paths: ["feat/web/**", "feat/api/**", ".github/workflows/browser-tests.yml"]
  push:
    branches: [main]
    paths: ["feat/web/**", "feat/api/**", ".github/workflows/browser-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: python -m pip install -r feat/api/requirements.txt
      - working-directory: feat/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            feat/web/playwright-report/
            feat/web/test-results/
          retention-days: 7
