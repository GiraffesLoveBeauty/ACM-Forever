name: API tests

on:
  pull_request:
    paths:
      - "API.md"
      - "feat/api/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "API.md"
      - "feat/api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r feat/api/requirements.txt

      - name: Run API contract tests
        run: python -m unittest discover -s feat/api/tests -p "test_*.py"
