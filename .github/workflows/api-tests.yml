name: API tests

on:
  pull_request:
    paths:
      - "docs/api.md"
      - "feat/api/**"
      - "feat/web/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "docs/api.md"
      - "feat/api/**"
      - "feat/web/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r feat/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"

      - name: Build Vue frontend
        working-directory: feat/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run API contract tests
        run: python -m unittest discover -s feat/api/tests -p "test_*.py"

      - name: Run Vue component regression tests
        working-directory: feat/web
        run: pnpm test

      - name: Run Web unit tests
        run: node --test feat/api/tests/admin-history.test.cjs feat/api/tests/cf-sync.test.cjs feat/api/tests/theme-colors.test.cjs feat/api/tests/theme-performance.test.cjs
