name: Android signed release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release manifest contracts
        run: python -m unittest discover -s Android_APP/tests -p test_update_release.py -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/acmforever-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: Android_APP/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Create update manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          python Android_APP/tools/create_update_manifest.py \
            --apk Android_APP/app/app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --server "$GITHUB_SERVER_URL" --output-dir "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"

      - name: Attach APK and update manifest to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APK_NAME: ${{ steps.manifest.outputs.apk_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --clobber
