name: Android signed release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/acmforever-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: Android_APP/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Create update manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          apk="Android_APP/app/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_path"
          badging="$("$aapt_path" dump badging "$apk" | sed -n '1p')"
          package_name="$(printf '%s' "$badging" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$package_name" = "com.giraffeslovebeauty.acmforever"
          test "$version_code" -gt 13
          test -n "$version_name"
          apk_name="acmforever-${version_name}.apk"
          cp "$apk" "$RUNNER_TEMP/$apk_name"
          sha256="$(sha256sum "$RUNNER_TEMP/$apk_name" | cut -d ' ' -f 1)"
          apk_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}"
          jq -n \
            --arg packageName "$package_name" \
            --argjson versionCode "$version_code" \
            --arg versionName "$version_name" \
            --arg apkUrl "$apk_url" \
            --arg sha256 "$sha256" \
            --arg notes "${RELEASE_NOTES:-本次更新没有附加说明。}" \
            '{packageName:$packageName,versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}' \
            > "$RUNNER_TEMP/update.json"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Attach APK and update manifest to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APK_NAME: ${{ steps.manifest.outputs.apk_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --clobber
