plugins { id 'com.android.dynamic-feature' }
android {
    namespace 'com.giraffeslovebeauty.acmforever.admin'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { minSdk 26 }
    buildTypes { preview { initWith release; matchingFallbacks = ['release'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':app'); testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
def moduleMetadata = tasks.register('writeModuleMetadata') {
    def source = rootProject.file('app/build.gradle')
    def target = layout.buildDirectory.dir('generated/module-assets')
    inputs.file(source); outputs.dir(target)
    doLast {
        def code = (source.text =~ /versionCode (\d+)/)[0][1] as int
        def out = new File(target.get().asFile, 'modules/admin.json')
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.toJson([id:'admin', api:1, versionCode:code, kind:'native', splitName:'admin']), 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/module-assets'))
tasks.named('preBuild') { dependsOn moduleMetadata }

def previewMetadata = tasks.register('writePreviewModuleMetadata') {
    def code = providers.gradleProperty('previewVersionCode').orElse(provider {
        ((rootProject.file('app/build.gradle').text =~ /versionCode (\d+)/)[0][1] as int) - 1
    }.map { it.toString() })
    def target = layout.buildDirectory.dir('generated/preview-module-assets')
    inputs.property('code', code); outputs.dir(target)
    doLast {
        def out = new File(target.get().asFile, 'modules/admin.json'); out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.toJson([id:'admin', api:1, versionCode:code.get().toInteger(), kind:'native', splitName:'admin']), 'UTF-8')
    }
}
android.sourceSets.preview.assets.srcDir(layout.buildDirectory.dir('generated/preview-module-assets'))
tasks.matching { it.name == 'prePreviewBuild' }.configureEach { dependsOn previewMetadata }
