plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giraffeslovebeauty.acmforever'
    compileSdk 35

    defaultConfig {
        applicationId 'com.giraffeslovebeauty.acmforever'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.1.12'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
