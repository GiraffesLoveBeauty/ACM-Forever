plugins {
    id 'com.android.application'
}

def releaseKeyStorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'com.giraffeslovebeauty.acmforever'
    compileSdk 35

    defaultConfig {
        applicationId 'com.giraffeslovebeauty.acmforever'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.1.12'
    }

    signingConfigs {
        release {
            if (releaseKeyStorePath) {
                storeFile file(releaseKeyStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeyStorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
