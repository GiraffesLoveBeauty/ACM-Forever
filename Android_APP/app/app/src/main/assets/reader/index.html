<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https:; base-uri 'none'; form-action 'none'">
<style>
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{color:#1e211c;background:#fff;font:15px/1.8 sans-serif;overflow-wrap:anywhere}
*,*::before,*::after{box-sizing:border-box}
#article{min-width:0;max-width:100%}#article>:first-child{margin-top:0}#article>:last-child{margin-bottom:0}
h1,h2,h3{line-height:1.5}
pre{display:block;margin:12px 0;width:100%;max-width:100%;min-width:0;background:var(--panel,#f4f5f1);border:1px solid var(--line,#e5e8e0);padding:12px;border-radius:8px;overflow-x:auto;overscroll-behavior-x:contain;white-space:pre;overflow-wrap:normal;word-break:normal;text-align:left;text-indent:0;direction:ltr;unicode-bidi:isolate;font:13px/1.65 ui-monospace,Consolas,"Liberation Mono",monospace;tab-size:4}
code{font-family:ui-monospace,Consolas,"Liberation Mono",monospace}
pre code{display:block;width:max-content;min-width:100%;margin:0;padding:0;border:0;background:transparent;font:inherit;text-align:inherit;white-space:inherit;overflow-wrap:normal;word-break:normal}
blockquote{margin:12px 0;padding-left:12px;border-left:3px solid var(--brand,#315b36);color:var(--muted,#70776b)}
table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}td,th{padding:8px;border:1px solid var(--line,#e5e8e0)}img{max-width:100%;height:auto}a{color:var(--brand,#315b36)}math[display=block]{display:block;max-width:100%;overflow:auto}
</style>
<script src="marked.min.js"></script><script src="purify.min.js"></script><script src="katex.min.js"></script><script src="auto-render.min.js"></script><script src="content.js"></script></head><body><article id="article"></article></body></html>
